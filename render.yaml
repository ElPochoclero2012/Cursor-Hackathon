services:
  - type: web
    name: stock-semilla
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.14.1"
      - key: STOCK_DB_PATH
        value: /var/data/app.db
    disk:
      name: stock-db
      mountPath: /var/data
      sizeGB: 1
